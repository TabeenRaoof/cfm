name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The root typecheck covers packages/* only. The scanner app (browser code + operator
      # scripts) and its Cloudflare Functions each need their own lib/types, so they are checked
      # separately — apps/scanner's tsconfig once went unrun with 26 real errors in it (D-044).
      - name: Typecheck scanner app
        run: npm run -w @cfm/scanner-app typecheck

      - name: Typecheck scanner Functions
        run: npm run -w @cfm/scanner-app typecheck:functions

      - name: Typecheck web app
        run: npm run -w @cfm/web typecheck

      # The web Worker (API + document queue consumer) runs on the Workers runtime, so it's checked
      # against the Workers types rather than the browser's (D-051).
      - name: Typecheck web Worker
        run: npm run -w @cfm/web typecheck:worker

      - name: Tests
        run: npm test

      # The catalog gate is separate from the tests on purpose: it is an editorial check, not a
      # correctness one, and its failure message needs to reach whoever drafted the requirement.
      - name: Catalog gate
        run: npm run catalog:check

      # Proves the deterministic path still runs on a bare Node with no build step — a claim
      # that decays silently the moment someone adds an enum or a parameter property.
      - name: Smoke (no build step)
        run: npm run smoke

      # Builds the public scanner and runs its own gates: catalog validation, a non-empty slice
      # per market, and the check that the bundle cannot transmit the visitor's file.
      - name: Scanner build
        run: npm run scanner:preview

      # The web app's own gate: the build fails if anything shaped like a server secret reaches
      # the browser bundle. The row-level security tests run in `npm test` above, against the real
      # migrations on an in-process Postgres (apps/web/test/rls.test.ts).
      - name: Web app build
        run: npm run -w @cfm/web build:preview
